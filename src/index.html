<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FintecApp</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fff;color:#121212;}
    app-root{display:block;min-height:100vh;padding:2rem;box-sizing:border-box;}
    app-root:not(:empty){padding:0;}
    .app-loading{display:flex;align-items:center;justify-content:center;min-height:50vh;font-size:1rem;color:#666;}
  </style>
</head>
<body>
  <app-root>
    <p class="app-loading" aria-live="polite">Loading…</p>
  </app-root>
</body>
</html>
